name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4 # Updated to v4 for latest node support

    - name: Install Poetry
      run: pipx install poetry

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5 # Updated to v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'poetry' # Automatically caches your dependencies

    - name: Install dependencies
      run: poetry install --with dev # Installs everything including pytest

    - name: Test with pytest
      run: |
        # Use 'poetry run' to execute commands within the virtual env
        poetry run pytest
