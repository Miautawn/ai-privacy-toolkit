[tool.poetry]
name = "ai-privacy-toolkit"
version = "0.2.1"
description = "A toolkit for tools and techniques related to the privacy and compliance of AI models."
authors = ["Abigail Goldsteen <abigailt@il.ibm.com>"]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
repository = "https://github.com/IBM/ai-privacy-toolkit"
documentation = "https://ai-privacy-toolkit.readthedocs.io/en/latest/"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
numpy = "^2.4.2"
pandas = "^3.0.1"
scipy = "^1.17.1"
scikit-learn = "^1.8.0"
torch = "^2.10.0"
tqdm = "^4.67.3"
matplotlib = "^3.10.8"
adversarial-robustness-toolbox = "^1.20.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
xgboost = "^3.2.0"
pillow = "^12.1.1"
sortedcontainers = "^2.4.0"
ipykernel = "^7.2.0"
notebook = "^7.5.4"
jupyter = "^1.1.1"
ipywidgets = "^8.1.8"
ruff = "^0.15.4"
pre-commit = "^4.5.1"


[tool.poetry.group.docs.dependencies]
sphinx-rtd-theme = "^3.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
